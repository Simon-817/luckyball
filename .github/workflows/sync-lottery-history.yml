name: Sync lottery history

on:
  workflow_dispatch:
  schedule:
    - cron: "16 13 * * 0,2,4"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update lottery history
        run: python scripts/sync_lottery_history.py --wait-for-current --interval-seconds 60
      - name: Publish changed data
        run: |
          if git diff --quiet -- data/lottery_history.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lottery_history.json
          git commit -m "Update lottery history data"
          git push
