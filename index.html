<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>双色球选号</title>
    <link rel="stylesheet" href="./styles.css?v=20260617-filter-v2" />
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <div class="brand">
          <h1>双色球选号</h1>
        </div>
        <div class="date-pill" aria-label="当前日期">
          <span id="dateLabel">0000-00-00 星期一</span>
        </div>
      </header>

      <section class="hero-card" aria-label="AI选号">
        <div class="generator-balls" id="generatorBalls"></div>
        <button class="ai-button" id="aiPickBtn" type="button">
          AI选号
        </button>
      </section>

      <section class="white-card current-card" aria-labelledby="currentTitle">
        <div class="section-head">
          <h2 id="currentTitle">本期投注</h2>
        </div>
        <div class="current-lines" id="currentBetList">
          <p class="empty-copy">点击 AI选号 生成本期投注号码</p>
        </div>
        <button class="bet-button" id="betBtn" type="button" disabled>投注</button>
      </section>

      <section class="draw-section" aria-labelledby="drawTitle">
        <div class="section-head draw-head">
          <h2 id="drawTitle">开奖结果</h2>
          <div class="countdown-line">
            <span>距离下期开奖</span>
            <strong id="countdown">--:--:--</strong>
          </div>
        </div>
        <div class="draw-card" id="latestDrawCard">
          <div class="draw-loading">正在同步最近一期开奖结果</div>
        </div>
      </section>

      <section class="history-section" aria-labelledby="historyTitle">
        <div class="section-head history-head">
          <div class="history-title-group">
            <h2 id="historyTitle">历史投注</h2>
            <div class="history-filter" id="historyFilter">
              <button
                class="history-filter-trigger"
                id="historyFilterTrigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="historyFilterLabel">近30天</span>
                <img src="./assets/chevron-down.svg" alt="" aria-hidden="true" />
              </button>
              <div
                class="history-filter-menu"
                id="historyFilterMenu"
                role="listbox"
                aria-label="筛选历史投注记录"
                hidden
              >
                <button type="button" role="option" data-value="30d" aria-selected="true">近30天</button>
                <button type="button" role="option" data-value="6m" aria-selected="false">近半年</button>
                <button type="button" role="option" data-value="1y" aria-selected="false">近1年</button>
                <button type="button" role="option" data-value="all" aria-selected="false">全部</button>
              </div>
            </div>
          </div>
          <div class="history-actions">
            <button class="delete-toggle" id="deleteToggle" type="button" aria-label="删除投注记录">
              <img src="./assets/delete.svg" alt="" aria-hidden="true" />
              <span class="delete-done-label">完成</span>
            </button>
          </div>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">暂无投注记录</div>
        </div>
      </section>
    </main>

    <script src="./history-utils.js?v=20260617-filter-v2"></script>
    <script src="./app.js?v=20260617-filter-v2"></script>
  </body>
</html>
